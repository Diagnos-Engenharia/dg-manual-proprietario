name: Diagnose main runtime

on:
  push:
    branches: [diagnostic/main-runtime]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check available deployment secrets
        env:
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_SECRET: ${{ secrets.POSTGRES_URL }}
          VERCEL_TOKEN_SECRET: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID_SECRET: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_SECRET: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          for VAR in DATABASE_URL_SECRET POSTGRES_URL_SECRET VERCEL_TOKEN_SECRET VERCEL_ORG_ID_SECRET VERCEL_PROJECT_ID_SECRET; do
            if [ -n "${!VAR}" ]; then echo "$VAR=present"; else echo "$VAR=absent"; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe production URLs
        shell: bash
        run: |
          set +e
          for URL in             "https://dg-manual-proprietario-git-main-diagnos-engenharias-projects.vercel.app"             "https://dg-manual-proprietario.vercel.app"; do
            echo "============================================================"
            echo "URL: $URL"
            curl -sS -L -o /tmp/body.txt -w "FINAL_URL=%{url_effective}\nHTTP=%{http_code}\nREDIRECTS=%{num_redirects}\nTIME=%{time_total}\n" "$URL"
            grep -o "<title>[^<]*</title>" /tmp/body.txt | head -1 || true
          done
      - name: Validate auth API health
        shell: bash
        run: |
          echo "--- SESSION ENDPOINT ---"
          curl -sS -D /tmp/session-headers.txt -o /tmp/session-body.txt -w "HTTP=%{http_code}\n" "https://dg-manual-proprietario.vercel.app/api/auth/get-session"
          cat /tmp/session-headers.txt
          cat /tmp/session-body.txt
          echo
          echo "--- INVALID SIGN-IN SHOULD FAIL CLEANLY, NOT 500 ---"
          CODE=$(curl -sS -o /tmp/auth-body.txt -w "%{http_code}" \
            -H "content-type: application/json" \
            -d '{"email":"diagnostic-do-not-use@example.invalid","password":"invalid-password-123"}' \
            "https://dg-manual-proprietario.vercel.app/api/auth/sign-in/email")
          echo "AUTH_HTTP=$CODE"
          cat /tmp/auth-body.txt
          echo
          if [ "$CODE" -ge 500 ]; then
            echo "Auth endpoint returned server error"
            exit 1
          fi

      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate production in real browser
        shell: bash
        run: |
          cat > probe.mjs <<'EOF'
          import { chromium } from "@playwright/test";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on("pageerror", e => pageErrors.push(e.message));
          page.on("console", m => { if (m.type() === "error") consoleErrors.push(m.text()); });
          const response = await page.goto("https://dg-manual-proprietario.vercel.app", { waitUntil: "networkidle", timeout: 60000 });
          console.log("status", response?.status());
          console.log("url", page.url());
          console.log("title", await page.title());
          console.log("body", (await page.locator("body").innerText()).slice(0, 2500));
          console.log("pageErrors", JSON.stringify(pageErrors));
          console.log("consoleErrors", JSON.stringify(consoleErrors));
          const emailCount = await page.locator('input[type="email"]').count();
          const passwordCount = await page.locator('input[type="password"]').count();
          const submitCount = await page.getByRole("button", { name: "ENTRAR NA MINHA CONTA" }).count();
          console.log("loginControls", { emailCount, passwordCount, submitCount });
          if (!page.url().includes("/sign-in")) throw new Error("Root did not redirect to /sign-in");
          if (!emailCount || !passwordCount || !submitCount) throw new Error("Login UI did not hydrate/render correctly");
          if (pageErrors.length) throw new Error("Client page errors: " + pageErrors.join(" | "));
          await browser.close();
          EOF
          node probe.mjs
