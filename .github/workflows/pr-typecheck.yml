name: PR validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [test/checklist-dual-scope]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build preview
        run: pnpm build
      - name: Install browser test tooling
        run: |
          pnpm add -D --lockfile=false @playwright/test@1.56.1
          pnpm exec playwright install --with-deps chromium
      - name: Start preview and validate in Chromium
        shell: bash
        run: |
          pnpm start > /tmp/dg-manual-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail --location http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          node tests/pr-preview-smoke.mjs || (cat /tmp/dg-manual-preview.log && exit 1)


  deployed-preview-smoke:
    runs-on: ubuntu-latest
    needs: [typecheck, preview-smoke]
    timeout-minutes: 10
    steps:
      - name: Validate deployed PR opens full SaaS
        shell: bash
        run: |
          URL="https://dg-manual-proprietario-git-c87adc-diagnos-engenharias-projects.vercel.app"
          for attempt in {1..60}; do
            CODE=$(curl -L -sS -o /tmp/deployed.html -w "%{http_code}" "$URL" || true)
            if [ "$CODE" = "200" ]; then
              if grep -q "ENTRAR NA MINHA CONTA" /tmp/deployed.html; then
                echo "Full SaaS preview is available at $URL"
                exit 0
              fi
              if grep -q "Ambiente de teste" /tmp/deployed.html; then
                echo "Preview ainda está no harness isolado; DATABASE_URL de Preview não está disponível."
                cat /tmp/deployed.html | head -c 2000
                exit 1
              fi
            fi
            sleep 5
          done
          echo "O preview não apresentou a tela normal de login dentro do prazo."
          cat /tmp/deployed.html | head -c 2000 || true
          exit 1
